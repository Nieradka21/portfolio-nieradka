<h2 class="section-title">[PERFORMANCE_METRICS]</h2>

<div class="skills-container">
    <div *ngFor="let skill of sortedSkills" class="skill-card">

        <div class="skill-header">
            <span>{{ skill.name }}</span>
            <span class="level-tag" [class]="levelClass(skill.level)">{{ skill.level }}</span>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" [class]="levelClass(skill.level)"></div>
        </div>

        <span class="category-badge">{{ skill.category }}</span>

    </div>
</div>
